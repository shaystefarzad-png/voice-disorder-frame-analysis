name: Collect saved final real-data evaluations
on:
  workflow_dispatch:
  push:
    paths:
      - ci/collect_final_complete_results.py
      - .github/workflows/collect-final-complete-results.yml
permissions:
  contents: write
  actions: read
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-complete-real-d*
          path: downloaded-final-complete/
          run-id: 44480674288
          github-token: ${{ github.token }}
      - run: python3 -m pip install --quiet openpyxl
      - name: Read completed frozen evaluations and correct the planned statistical family
        run: python3 ci/collect_final_complete_results.py
      - uses: actions/upload-artifact@v4
        with:
          name: final-complete-collected-results
          path: final-complete-collected-results/
          retention-days: 30
      - name: Publish authorized aggregate tables without individual identifiers
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            for(const name of ['Collected_Report.json','Collected_Real_Results.xlsx']){
              const path=`final-complete-collected-results/${name}`;let sha;
              try{sha=(await github.rest.repos.getContent({...context.repo,path})).data.sha;}catch(e){if(e.status!==404)throw e;}
              await github.rest.repos.createOrUpdateFileContents({...context.repo,path,sha,message:'Collect saved real evaluations without retraining',content:fs.readFileSync(path).toString('base64')});
            }
