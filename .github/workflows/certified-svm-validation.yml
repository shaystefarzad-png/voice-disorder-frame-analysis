name: Verify certified SVM before research resume
on:
  workflow_dispatch:
  push:
    paths:
      - verifyCertifiedSVM.m
      - ci/certifiedChecks.m.fragment
      - .github/workflows/certified-svm-validation.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
          products: Statistics_and_Machine_Learning_Toolbox Parallel_Computing_Toolbox
      - uses: matlab-actions/run-command@v2
        with:
          command: verifyCertifiedSVM; runSyntheticWorkflow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certified-svm-validation
          path: synthetic-test-artifacts/
          retention-days: 30
