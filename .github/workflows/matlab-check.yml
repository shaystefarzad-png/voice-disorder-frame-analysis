name: MATLAB installation check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matlab:
    if: github.event.repository.private == false
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: matlab-actions/setup-matlab@v2
        with:
          release: R2023b
          products: Statistics_and_Machine_Learning_Toolbox Parallel_Computing_Toolbox

      - name: Verify MATLAB and toolboxes
        uses: matlab-actions/run-command@v2
        with:
          command: >-
            disp(version);
            rng(1405,'twister');
            X=[randn(30,3)-1;randn(30,3)+1];
            Y=[zeros(30,1);ones(30,1)];
            models={fitcsvm(X,Y),fitcknn(X,Y),fitcensemble(X,Y,'Method','Bag','NumLearningCycles',5),fitcnb(X,Y)};
            for k=1:numel(models), prediction=predict(models{k},X); assert(numel(prediction)==60); end;
            [~,pvalue]=ttest2(X(Y==0,1),X(Y==1,1)); assert(isfinite(pvalue));
            [rank,weight]=relieff(X,Y,5); assert(numel(rank)==3 && all(isfinite(weight)));
            nca=fscnca(X,Y,'IterationLimit',5,'Verbose',0); assert(numel(nca.FeatureWeights)==3);
            pool=parpool('local',2); assert(pool.NumWorkers==2); delete(pool);
            disp('MATLAB_AND_TOOLBOX_CHECK_PASSED');
