name: Export existing training curves for thesis
on:
  push:
    paths:
      - .github/workflows/export-thesis-cv.yml
permissions:
  contents: write
  actions: read
jobs:
  export:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: final-complete-real-d*
          path: existing/
          run-id: 44480674288
          github-token: ${{ github.token }}
      - run: python3 -m pip install --quiet openpyxl
      - name: Extract saved training CV scores, no training and no individual records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,zipfile,json
          from openpyxl import load_workbook
          out=Path('thesis-source-assets');out.mkdir(exist_ok=True)
          manifest=[]
          with zipfile.ZipFile(out/'CV_Training_Assets.zip','w',zipfile.ZIP_DEFLATED) as z:
            for d in [1,3,4,5,6]:
              root=Path('existing')/f'final-complete-real-d{d}'
              for scenario in ['S1_25ms','S2_75ms','S3A_Hybrid']:
                candidates=list(root.glob(f'Repeat_001/*/D1_FS/{scenario}/CV_Candidates.xlsx'))
                assert len(candidates)==1,(d,scenario,candidates)
                wb=load_workbook(candidates[0],read_only=True,data_only=True)
                rows=list(wb['Candidates'].values);wb.close()
                file=out/f'd{d}_{scenario}.csv'
                with file.open('w',newline='') as f:csv.writer(f).writerows(rows)
                z.write(file,file.name);manifest.append(dict(DiseaseIndex=d,Scenario=scenario,Rows=len(rows)-1))
            z.writestr('manifest.json',json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: thesis-existing-CV-assets
          path: thesis-source-assets/CV_Training_Assets.zip
      - uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path='thesis-source-assets/CV_Training_Assets.zip';let sha;
            try{sha=(await github.rest.repos.getContent({...context.repo,path})).data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({...context.repo,path,sha,message:'Export saved aggregate training curves for thesis',content:fs.readFileSync(path).toString('base64')});
