name: Diagnose full research failure without retraining
on:
  push:
    paths:
      - .github/workflows/diagnose-full-failure.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read failed job and its actual MATLAB error
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 ci/diagnoseFullFailure.py
      - name: Preserve exact failure evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add recovery/full-run-diagnosis
          git commit -m 'Record exact blocking error from full research run' || exit 0
          git push origin HEAD:main
